version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm run verify:no-conflicts
    build:
      commands:
        - export NEXT_TELEMETRY_DISABLED=1
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
